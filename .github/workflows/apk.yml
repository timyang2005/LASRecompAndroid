# 固定签名的 release APK：每次构建都用同一把密钥，装到手机上可直接安装，
# 后续版本可覆盖升级（签名证书 SHA-256 恒定，见 EXPECTED_CERT_SHA256）。
#
# 构建链按 README "Building from source"：
#   android/deps/build_deps.sh       SDL3 / shaderc / Vulkan 头 / VMA / volk / DejaVu（必需）
#   android/deps/build_ffmpeg.sh     影片与启动器背景（可选，失败则 LARECOMP_NO_FFMPEG）
#   android/deps/build_gen_deps.sh  手机端游戏代码构建器 Python/zig（可选，失败则不打包 gen/）
#   cd android/lasrecomp && ./gradlew assembleRelease
#
# 签名：app/build.gradle.kts 读 ~/.lasrecomp/keystore.properties；本工作流写入该文件，
# 默认指向仓库内 android/lasrecomp/ci/lasrecomp-release.jks。若配置同名 Secrets 则改用私有密钥。
name: Android APK (signed)

on:
  # 工作流或签名材料有变化时自动构建一次（分支工作流也能被 push 触发）
  push:
    branches: [feat/zh-launcher]
    paths:
      - '.github/workflows/apk.yml'
      - 'android/lasrecomp/ci/**'
  # 手动触发：工作流在默认分支时可用 UI 的 "Run workflow"，否则用 REST API 指定 ref
  workflow_dispatch:
    inputs:
      full:
        description: '完整构建（FFmpeg + 手机端游戏代码构建器）'
        type: boolean
        default: true
      publish:
        description: '同步发布到滚动 Release（免登录直链）'
        type: boolean
        default: true

permissions:
  contents: write   # 滚动 Release / 上传附件

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # 仓库内 CI 密钥的证书 SHA-256（无冒号、小写）；apksigner 校验通过才交付 APK
      EXPECTED_CERT_SHA256: f00f7ebe8bb0d960a74399db2d4a8fba5fe13d5448dd2a662c945a896a2f4cff
      FULL: ${{ inputs.full == true || github.event_name == 'push' }}
      PUBLISH: ${{ inputs.publish == true || github.event_name == 'push' }}
    steps:
      - name: Checkout（含子模块 libadrenotools）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk || true
          df -h /

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK / NDK / CMake
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || { echo "::error::sdkmanager 不存在：$SDKM"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.30.4' 'ndk;30.0.16248370'
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build zip unzip
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/30.0.16248370" >> "$GITHUB_ENV"
          # build_ffmpeg.sh / build_unicorn.sh 默认另下载 Linux NDK r30：复用 SDK 里同一份
          echo "ANDROID_NDK_LINUX=$SDK/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "$SDK/cmake/3.30.4/bin" >> "$GITHUB_PATH"

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/lasrecomp/local.properties

      - name: 缓存原生依赖
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            android/deps/src
            android/deps/out
          key: deps-${{ runner.os }}-${{ hashFiles('android/deps/*.sh') }}

      - name: 缓存 Gradle
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/lasrecomp/**/*.gradle.kts', 'android/lasrecomp/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 原生依赖（必需）
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if bash android/deps/build_deps.sh; then exit 0; fi
            echo "::warning::build_deps.sh 第 $i 次失败，20 秒后重试"
            sleep 20
          done
          echo "::error::build_deps.sh 三次失败"; exit 1

      # 以下两步失败不阻断 APK：清掉半成品后由 CMake / prepareLasRecomp 自动降级
      - name: FFmpeg（影片与启动器背景）
        if: env.FULL == 'true'
        run: |
          set -euo pipefail
          if [ -f android/deps/out/lib/libavformat.so ]; then echo '已有 FFmpeg，跳过'; exit 0; fi
          if ! bash android/deps/build_ffmpeg.sh; then
            echo "::warning::FFmpeg 构建失败，APK 将以 LARECOMP_NO_FFMPEG 编译（无影片/背景）"
            rm -f android/deps/out/lib/libav*.so android/deps/out/lib/libswscale.so
          fi

      - name: 手机端游戏代码构建器（Python / zig）
        if: env.FULL == 'true'
        run: |
          set -euo pipefail
          if [ -f android/deps/out/gen/zig/libzig.so ]; then echo '已有 on-device builder，跳过'; exit 0; fi
          if ! bash android/deps/build_gen_deps.sh; then
            echo "::warning::on-device builder 构建失败，APK 将不含 gen/（需自行提供 lasgame.so）"
            rm -rf android/deps/out/gen
          fi

      - name: 写入固定签名配置
        id: sign
        env:
          CI_STORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          CI_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.lasrecomp"
          if [ -n "$CI_STORE_B64" ]; then
            echo "$CI_STORE_B64" | base64 -d > "$HOME/.lasrecomp/release.jks"
            STORE="$HOME/.lasrecomp/release.jks"
            STORE_PASS="$CI_STORE_PASSWORD"
            ALIAS="${CI_KEY_ALIAS:-lasrecomp}"
            KEY_PASS="${CI_KEY_PASSWORD:-$CI_STORE_PASSWORD}"
            echo "APK_SIGN_BUILTIN=false" >> "$GITHUB_ENV"
            echo '::notice::使用仓库 Secrets 中的签名密钥'
          else
            STORE="$GITHUB_WORKSPACE/android/lasrecomp/ci/lasrecomp-release.jks"
            STORE_PASS=lasrecomp
            ALIAS=lasrecomp
            KEY_PASS=lasrecomp
            echo "APK_SIGN_BUILTIN=true" >> "$GITHUB_ENV"
            echo '::notice::使用仓库内置的固定 CI 签名密钥'
          fi
          [ -f "$STORE" ] || { echo "::error::keystore 不存在：$STORE"; exit 1; }
          cat > "$HOME/.lasrecomp/keystore.properties" <<EOF
          storeFile=$STORE
          storePassword=$STORE_PASS
          keyAlias=$ALIAS
          keyPassword=$KEY_PASS
          EOF
          # 只确认写入，绝不回显文件内容（含密码）
          test -s "$HOME/.lasrecomp/keystore.properties"

      - name: 编译并签名 release APK
        working-directory: android/lasrecomp
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon assembleRelease

      - name: 校验签名并整理产物
        id: apk
        run: |
          set -euo pipefail
          APK=android/lasrecomp/app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::APK 未生成：$APK"; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt
          cat /tmp/apksigner.txt
          # apksigner 各版本前缀不同："V2 Signer: certificate SHA-256 digest:"、
          # "Signer #1 certificate SHA-256 digest:" 等，这里只锚定 digest 字段本身。
          # digest 可能带冒号：统一去掉冒号与空白后转小写
          FP=$(awk -F'SHA-256 digest: ' '/certificate SHA-256 digest/{gsub(/:|[[:space:]]/,"",$2); print tolower($2); exit}' /tmp/apksigner.txt)
          [ -n "$FP" ] || { echo "::error::无法从 apksigner 输出提取证书指纹"; exit 1; }
          echo "证书 SHA-256: $FP"
          grep -Eq 'Verified using (v2|v3) scheme.*: true' /tmp/apksigner.txt || { echo "::error::缺少 v2/v3 签名"; exit 1; }
          if [ "${APK_SIGN_BUILTIN:-false}" = "true" ]; then
            [ "$FP" = "$EXPECTED_CERT_SHA256" ] || {
              echo "::error::签名证书不匹配：期望 $EXPECTED_CERT_SHA256，实际 $FP"; exit 1; }
            echo "::notice::固定签名校验通过，可覆盖安装"
          else
            echo "::notice::使用自定义密钥，跳过内置指纹断言"
          fi
          mkdir -p dist
          VERSION=$(python3 -c 'import json; print(json.load(open("android/lasrecomp/app/build/outputs/apk/release/output-metadata.json"))["elements"][0].get("versionName") or "ci")' 2>/dev/null || echo "ci")
          OUT="LASRecomp-zh-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "dist/$OUT"
          cp "$APK" "dist/LASRecomp-zh-latest.apk"
          (cd dist && sha256sum "$OUT" > "$OUT.sha256" && sha256sum LASRecomp-zh-latest.apk > LASRecomp-zh-latest.apk.sha256)
          { cat /tmp/apksigner.txt; echo; echo "证书 SHA-256: $FP"; echo "构建: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > dist/signature.txt
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$FP" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LASRecomp-zh-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: 发布到滚动 Release（免登录直链）
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=apk-latest
          TITLE="LAS Recomp 汉化版 · 固定签名 APK"
          NOTES="由 .github/workflows/apk.yml 自动构建。签名证书 SHA-256: $EXPECTED_CERT_SHA256（每次相同，可直接覆盖安装）。固定直链见下方 Assets。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --prerelease --title "$TITLE" --notes "$NOTES" dist/*
          fi
          echo "::notice::直链 https://github.com/$GH_REPO/releases/download/$TAG/LASRecomp-zh-latest.apk"

      - name: 交付说明
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 固定签名 APK 已生成

          - 文件：\`${{ steps.apk.outputs.name }}\`（另有固定名 \`LASRecomp-zh-latest.apk\`）
          - 签名证书 SHA-256：\`${{ steps.apk.outputs.sha256 }}\`，已启用 v2/v3，可直接安装、可覆盖升级
          - 下载：本 run 的 Artifacts，或滚动 Release 直链
            https://github.com/${{ github.repository }}/releases/download/apk-latest/LASRecomp-zh-latest.apk
          - 安装：\`adb install -r LASRecomp-zh-latest.apk\`，或直接点开 APK（Android 11+ / arm64-v8a，需 Vulkan 1.3）
          EOF
