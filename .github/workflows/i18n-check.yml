# 启动器中文化的静态校验（键对齐、格式符、覆盖率、字体字形、UTF-8）。
# APK 的编译、签名与发布在 android-apk.yml；本工作流只做纯静态检查，几秒出结果。
name: i18n check

on:
  push:
    branches: [feat/zh-launcher]
    paths:
      - 'runtime/ui/i18n*'
      - 'runtime/settings.*'
      - 'tools/i18n_check.py'
      - 'tools/font_coverage.py'
      - 'android/lasrecomp/app/src/main/assets/res/fonts/**'
      - '.github/workflows/i18n-check.yml'
  pull_request:
    paths:
      - 'runtime/ui/i18n*'
      - 'runtime/settings.*'
      - 'tools/i18n_check.py'
      - 'tools/font_coverage.py'
      - 'android/lasrecomp/app/src/main/assets/res/fonts/**'
      - '.github/workflows/i18n-check.yml'
  workflow_dispatch:

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 校验简繁中文表
        run: python3 tools/i18n_check.py
      # 打包的中文字体是子集：表里新增的字如果不在里面，手机上就是方块。这一步把它变成构建失败。
      - name: 安装 fonttools
        run: pip install fonttools
      - name: 校验打包字体覆盖全部用字
        run: python3 tools/font_coverage.py
