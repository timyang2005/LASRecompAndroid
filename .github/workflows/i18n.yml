# 启动器中文化的静态校验（键对齐、格式符、覆盖率、UTF-8）。
# APK 的编译与固定签名在 .github/workflows/apk.yml，本文件不重复构建。
# 上游 mamcjr/LASRecompAndroid 没有 workflows；本文件只覆盖本 fork 的汉化分支产物。
name: i18n

on:
  push:
    paths:
      - 'runtime/ui/i18n*'
      - 'runtime/settings.*'
      - 'tools/i18n_check.py'
      - '.github/workflows/i18n.yml'
  pull_request:
    paths:
      - 'runtime/ui/i18n*'
      - 'runtime/settings.*'
      - 'tools/i18n_check.py'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:

jobs:
  # 纯标准库，ubuntu-latest 即可通过：键对齐、无重复、格式符一致、必须覆盖的键齐全、UTF-8。
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 校验简繁中文表
        run: python3 tools/i18n_check.py
