# LAS Recomp Android - this fork's release version (read by android/lasrecomp/app/build.gradle.kts).
#
#   baseName / baseCode  the upstream release this branch builds on. Copy them from upstream's
#                        android/lasrecomp/app/build.gradle.kts (versionName / versionCode) whenever main
#                        is fast-forwarded to a new upstream, and reset forkRev to 1.
#   forkRev              this fork's own revision on the same base: bump it for every localised release.
#
# versionName = <baseName>-zh.<forkRev>     0.5.11-zh.1
# versionCode = <baseCode>*100 + forkRev    27*100+1 = 2701
#
# The code must only ever go up (0.5.11-zh.2 = 2702, 0.5.11-zh.10 = 2710, then 0.5.12-zh.1 = 2801), so a
# release always installs over the previous one without uninstalling (saves kept).
baseName=0.5.11
baseCode=27
forkRev=1
